# Base de données de développement : PostgreSQL 17 sur le port 5434
#   docker compose up -d
services:
  db:
    image: postgres:17
    container_name: zener-station-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: zener_station
      POSTGRES_USER: zener
      POSTGRES_PASSWORD: zener
      TZ: Africa/Lome
    ports:
      - "5434:5432"
    volumes:
      - zener-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zener -d zener_station"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zener-pgdata:
